<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Onyi De Son of Grace</title>
  
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Global variables for consistent styling -->
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/pages/login.css">
</head>
<body class="login-body">

  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="login-title">Admin Portal</h1>
        <p class="login-desc">Sign in to manage the website content.</p>
      </div>

      <form id="login-form" class="login-form" novalidate>
        
        <!-- Error / Success Alert Container -->
        <div id="auth-alert" class="auth-alert" aria-live="polite" style="display: none;"></div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="admin@onyideson.com"
            autocomplete="email"
            required
          >
          <span class="error-msg" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
            <button type="button" id="toggle-password" class="btn-toggle-password" aria-label="Toggle password visibility">
              <!-- Eye icon -->
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye off icon (hidden by default via CSS) -->
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <span class="error-msg" id="password-error"></span>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me">
            <span class="checkbox-text">Remember me</span>
          </label>
          <button type="button" id="btn-forgot-password" class="btn-link">Forgot password?</button>
        </div>

        <button type="submit" id="btn-login" class="btn-primary btn-block">
          <span class="btn-text">Sign In</span>
          <div class="spinner-inline" id="login-spinner" style="display:none;"></div>
        </button>

      </form>
    </div>
    
    <div class="login-footer">
      <p>&copy; <script>document.write(new Date().getFullYear())</script> Onyi De Son of Grace. All rights reserved.</p>
      <a href="index.html" class="btn-link back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Website
      </a>
    </div>
  </main>

  <!-- JavaScript Modules -->
  <script type="module" src="./js/auth/login.js"></script>
</body>
</html>
